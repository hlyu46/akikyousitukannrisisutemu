<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>琉大 空き教室チェッカー (共通教育棟)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for clean horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .room-card {
            transition: all 0.2s ease;
        }
        .room-card:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl flex flex-col">
        
        <!-- App Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md z-10 sticky top-0">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-school mr-2"></i>琉大 空き教室チェッカー</h1>
                <button class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white" aria-label="Settings">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
            <p class="text-xs text-blue-100"><i class="fa-solid fa-rotate-right mr-1"></i>データ更新: <span id="updated-date">取得中...</span> (共通教育棟)</p>
        </header>

        <div class="bg-gray-50 border-b px-4 py-3 shadow-sm sticky top-[72px] z-10">
            <!-- Day Selector -->
            <p class="text-sm font-bold text-gray-500 mb-2">曜日を選択</p>
            <div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar pb-1" id="day-selector">
                <!-- JavaScript will populate this -->
            </div>

            <!-- Period Selector -->
            <p class="text-sm font-bold text-gray-500 mb-2">時限を選択</p>
            <div class="grid grid-cols-4 gap-2" id="period-selector">
                <!-- JavaScript will populate this -->
            </div>
        </div>

        <div class="flex-grow p-4 bg-gray-100 overflow-y-auto" id="main-content">
            
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-lg font-bold text-gray-800 border-l-4 border-blue-600 pl-2 leading-none" id="result-title">
                    検索結果
                </h2>
                <span class="text-sm font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-md" id="room-count">0件</span>
            </div>

            <!-- Feature Legend -->
            <div class="flex gap-3 mb-4 text-xs text-gray-600 bg-white p-2 rounded-lg shadow-sm border border-gray-200">
                <div class="flex items-center"><span class="text-blue-500 mr-1"><i class="fa-solid fa-snowflake"></i></span>優先エアコン</div>
                <div class="flex items-center"><span class="text-green-500 mr-1"><i class="fa-solid fa-plug"></i></span>コンセント有</div>
            </div>

            <!-- Room List Container -->
            <div id="room-list" class="space-y-4 pb-6">
                <!-- JavaScript will populate rooms grouped by building -->
            </div>
            
        </div>
    </div>

    <script>
        // --- Data Definitions based on the PDF provided ---
        
        const days = ['月', '火', '水', '木', '金'];
        const periods = [
            { id: 1, name: '1限', time: '8:30~10:00' },
            { id: 2, name: '2限', time: '10:20~11:50' },
            { id: 3, name: '3限', time: '12:50~14:20' },
            { id: 4, name: '4限', time: '14:40~16:10' },
            { id: 5, name: '5限', time: '16:20~17:50' },
            { id: 6, name: '6限', time: '18:00~19:30' },
            { id: 7, name: '7限', time: '19:40~21:10' }
        ];

        // Grouped by buildings based on the text
        const classrooms = {
            "1号館": ["1-118", "1-217"],
            "2号館": ["2-100", "2-101", "2-104", "2-200", "2-201", "2-205", "2-300", "2-301", "2-302", "2-305"],
            "3号館": ["3-101", "3-102", "3-103", "3-104", "3-201", "3-202", "3-203", "3-204", "3-205", "3-301", "3-302", "3-303", "3-304", "3-305"],
            "4号館": ["4-101", "4-103", "4-104"]
        };

        // Specific room features extracted from the PDF text
        const priorityACRooms = ["2-100", "2-101", "2-200", "2-205", "2-300", "2-305", "3-104"];
        const powerOutletsRooms = ["2-200", "2-300"];

        // State variables
        let selectedDay = '月';
        let selectedPeriod = 3; // Default to 3rd period

        let availabilityData = {};
        let dataLoaded = false;

        function isRoomAvailable(day, period, room) {
            if (!dataLoaded) return false;
            if (availabilityData[day] && availabilityData[day][period]) {
                return availabilityData[day][period].includes(room);
            }
            return false;
        }

        function renderSelectors() {
            // Render Days
            const dayContainer = document.getElementById('day-selector');
            dayContainer.innerHTML = days.map(day => `
                <button onclick="selectDay('${day}')" 
                    class="shrink-0 px-5 py-2 rounded-full font-bold text-sm transition-colors border-2 
                    ${selectedDay === day ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100'}">
                    ${day}
                </button>
            `).join('');

            // Render Periods
            const periodContainer = document.getElementById('period-selector');
            periodContainer.innerHTML = periods.map(p => `
                <button onclick="selectPeriod(${p.id})" 
                    class="py-2 rounded-lg flex flex-col items-center justify-center transition-colors border-2
                    ${selectedPeriod === p.id ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100'}">
                    <span class="font-bold">${p.name}</span>
                    <span class="text-[10px] ${selectedPeriod === p.id ? 'text-blue-100' : 'text-gray-400'}">${p.time}</span>
                </button>
            `).join('');
        }

        function renderResults() {
            const listContainer = document.getElementById('room-list');
            const titleEl = document.getElementById('result-title');
            const countEl = document.getElementById('room-count');
            
            titleEl.innerText = `${selectedDay}曜日 ${selectedPeriod}限 の空き教室`;
            
            let totalAvailable = 0;
            let htmlContent = '';

            // Iterate through buildings
            for (const [building, rooms] of Object.entries(classrooms)) {
                // Filter available rooms for this building
                const availableRooms = rooms.filter(room => isRoomAvailable(selectedDay, selectedPeriod, room));
                
                if (availableRooms.length > 0) {
                    totalAvailable += availableRooms.length;
                    
                    // Render Building Header
                    htmlContent += `
                        <div class="mb-4">
                            <h3 class="text-sm font-bold text-gray-500 mb-2 flex items-center">
                                <i class="fa-regular fa-building mr-1"></i> ${building}
                            </h3>
                            <div class="grid grid-cols-2 gap-3">
                    `;

                    // Render individual room cards
                    availableRooms.forEach(room => {
                        const hasAC = priorityACRooms.includes(room);
                        const hasPower = powerOutletsRooms.includes(room);
                        
                        htmlContent += `
                            <div class="room-card bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex flex-col justify-between cursor-pointer border-l-4 border-l-blue-400">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xl font-black text-gray-800 tracking-tighter">${room}</span>
                                    <div class="flex gap-1 text-sm">
                                        ${hasAC ? '<span class="text-blue-500 bg-blue-50 w-6 h-6 rounded flex items-center justify-center" title="優先エアコン"><i class="fa-solid fa-snowflake"></i></span>' : ''}
                                        ${hasPower ? '<span class="text-green-500 bg-green-50 w-6 h-6 rounded flex items-center justify-center" title="コンセント"><i class="fa-solid fa-plug"></i></span>' : ''}
                                    </div>
                                </div>
                                <div class="text-[10px] text-gray-400">
                                    タップして詳細を見る
                                </div>
                            </div>
                        `;
                    });

                    htmlContent += `</div></div>`;
                }
            }

            if (totalAvailable === 0) {
                htmlContent = `
                    <div class="bg-white rounded-xl p-8 text-center shadow-sm border border-gray-200 mt-4">
                        <div class="text-gray-300 text-5xl mb-3"><i class="fa-regular fa-face-frown-open"></i></div>
                        <p class="font-bold text-gray-600">空き教室がありません</p>
                        <p class="text-sm text-gray-400 mt-1">他の時限を選択してください</p>
                    </div>
                `;
            }

            listContainer.innerHTML = htmlContent;
            countEl.innerText = `${totalAvailable}件`;
        }

        function selectDay(day) {
            selectedDay = day;
            renderSelectors();
            renderResults();
        }

        function selectPeriod(period) {
            selectedPeriod = period;
            renderSelectors();
            renderResults();
        }

        // Initialization on page load
        window.onload = async () => {
            renderSelectors();
            
            try {
                // Fetch external data file
                const response = await fetch('data.json');
                if (response.ok) {
                    const jsonData = await response.json();
                    
                    // 新フォーマット (updated_at と data が分かれている場合)
                    if (jsonData.data && jsonData.updated_at) {
                        availabilityData = jsonData.data;
                        document.getElementById('updated-date').innerText = jsonData.updated_at;
                    } else {
                        // 旧フォーマット (直接データが入っている場合)
                        availabilityData = jsonData;
                        document.getElementById('updated-date').innerText = "不明";
                    }
                    dataLoaded = true;
                } else {
                    console.error("Failed to load data.json");
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
            
            renderResults();
        };

    </script>
</body>
</html>
