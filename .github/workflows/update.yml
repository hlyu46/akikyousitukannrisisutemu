name: Update Classroom Data

on:
  schedule:
    # Run every Friday at 18:00 JST (09:00 UTC)
    - cron: '0 9 * * 5'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Tesseract & Poppler)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-jpn

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Update Script
      run: python update_data.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json
        # Only commit if data.json has changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update empty classroom data" && git push)
